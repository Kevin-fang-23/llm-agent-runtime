# Alembic CLI 配置（P2-Alembic）。
#
# 本项目**不在 ini 里维护 sqlalchemy.url**：
# - programmatic 路径（生产/测试）：Repository.create_tables() 用 Config()
#   注入 engine 实际 URL（cfg.attributes["db_url"]），与运行时同一事实来源；
# - CLI 路径：migrations/env.py 回退读 app.config.get_settings().database_url。
# 本文件只为 `alembic` 命令提供 script_location 与日志配置。
[alembic]
script_location = migrations
prepend_sys_path = .

# 日志段：programmatic Config()（config_file_name=None）不会读这里，
# 仅 CLI 调用时由 env.py 的 fileConfig 接管。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
