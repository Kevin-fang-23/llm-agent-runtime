<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Agent Runtime · 执行轨迹</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1d212d; --border: #2a2f3e;
    --text: #d7dae2; --muted: #8b91a3; --accent: #5b8cff; --green: #3fb96f;
    --red: #e5604c; --yellow: #d9a441; --purple: #a06ee1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  #metrics { display: flex; gap: 16px; margin-left: auto; font-size: 12px; color: var(--muted); }
  #metrics b { color: var(--text); }
  .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 51px); }
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .new-task { padding: 14px; border-bottom: 1px solid var(--border); }
  .new-task textarea { width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; resize: vertical; min-height: 64px; font-family: inherit; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  select, input[type=number] { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-family: inherit; }
  button.primary { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }
  #task-list { overflow-y: auto; flex: 1; }
  .task-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .task-item:hover { background: var(--panel2); }
  .task-item.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .task-item .goal { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-item .meta { color: var(--muted); font-size: 11px; margin-top: 3px; display: flex; gap: 8px; align-items: center; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .status.running { background: #1d3a5f; color: #79aaff; }
  .status.done { background: #16342a; color: var(--green); }
  .status.failed { background: #3d201c; color: var(--red); }
  .status.queued { background: #33290f; color: var(--yellow); }
  .status.budget_exceeded { background: #33290f; color: var(--yellow); }
  .status.canceled { background: #2a2f3e; color: var(--muted); }
  .status.waiting_approval { background: #2d1f47; color: #c9a6ff; }
  .ev.t-approval_granted, .ev.t-approval_rejected { border-left-color: #c9a6ff; }
  .ev.t-approval_granted .type, .ev.t-approval_rejected .type { color: #c9a6ff; }
  .main { overflow-y: auto; padding: 18px 22px; }
  .goal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .goal-box .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  #result { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; white-space: pre-wrap; line-height: 1.6; }
  #result .label, #timeline .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .ev { display: grid; grid-template-columns: 64px 130px 1fr; gap: 10px; padding: 7px 10px; border-left: 3px solid var(--border); margin-bottom: 6px; background: var(--panel); border-radius: 0 8px 8px 0; }
  .ev .seq { color: var(--muted); font-size: 11px; padding-top: 2px; }
  .ev .type { font-weight: 600; font-size: 12px; padding-top: 1px; }
  .ev .body { color: var(--muted); font-size: 12px; word-break: break-all; line-height: 1.5; }
  .ev.t-plan_created, .ev.t-replan { border-left-color: var(--purple); } .ev.t-plan_created .type, .ev.t-replan .type { color: var(--purple); }
  .ev.t-llm_step { border-left-color: var(--accent); } .ev.t-llm_step .type { color: var(--accent); }
  .ev.t-tool_result, .ev.t-selfheal_success { border-left-color: var(--green); } .ev.t-tool_result .type, .ev.t-selfheal_success .type { color: var(--green); }
  .ev.t-tool_error, .ev.t-tool_validation_failed, .ev.t-task_failed { border-left-color: var(--red); } .ev.t-tool_error .type, .ev.t-tool_validation_failed .type, .ev.t-task_failed .type { color: var(--red); }
  .ev.t-critic, .ev.t-budget_downgrade, .ev.t-budget_exceeded { border-left-color: var(--yellow); } .ev.t-critic .type, .ev.t-budget_downgrade .type, .ev.t-budget_exceeded .type { color: var(--yellow); }
  .ev.t-context_compressed { border-left-color: #2a9db5; } .ev.t-context_compressed .type { color: #2a9db5; }
  .ev.t-subagent_event { border-left-color: #7a6ff0; background: #191d2b; } .ev.t-subagent_event .type { color: #7a6ff0; }
  .ev.t-tool_replay { border-left-color: #a06ee1; } .ev.t-tool_replay .type { color: var(--purple); }
  .ev.t-tool_retry_scheduled { border-left-color: var(--yellow); } .ev.t-tool_retry_scheduled .type { color: var(--yellow); }
  .ev.t-tool_retry_success { border-left-color: var(--green); } .ev.t-tool_retry_success .type { color: var(--green); }
  .ev.t-tool_retry_exhausted { border-left-color: var(--red); } .ev.t-tool_retry_exhausted .type { color: var(--red); }
  .ev.t-step_done { border-left-color: #3fb96f; } .ev.t-step_done .type { color: #3fb96f; }
  .ev.t-task_done { border-left-color: var(--green); } .ev.t-task_done .type { color: var(--green); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .plan-chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; margin: 3px 4px 0 0; font-size: 12px; }
  .plan-chip.done { border-color: var(--green); color: var(--green); }
  .plan-chip.pending { color: var(--muted); }
  .plan-chip.warn { border-color: var(--yellow); color: var(--yellow); }
  /* 预算进度条（token / 步数双维度） */
  .bar-wrap { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 10px; margin: 4px 0; }
  .bar-label { font-size: 11px; color: var(--muted); }
  .bar { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); }
  /* 事件参数/结果可折叠 */
  .ev-more { grid-column: 3; margin-top: 4px; }
  .ev-more summary { cursor: pointer; color: var(--accent); font-size: 11px; }
  .ev-more pre { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
                 padding: 8px; margin: 6px 0 0; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>LLM Agent Runtime</h1>
  <span class="sub">自然语言目标 → 自主规划 → 工具执行 → 交付</span>
  <div id="metrics"></div>
  <input id="apikey" type="password" placeholder="API Key（X-API-Key）" autocomplete="off"
         style="width:200px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px">
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="new-task">
      <textarea id="goal" placeholder="输入任务目标，例如：查询北京和上海今天的天气，用沙箱计算两地温差，并把结论写入 reports/weather.md"></textarea>
      <div class="row">
        <select id="mode">
          <option value="react">ReAct 模式</option>
          <option value="plan_execute">Plan-and-Execute 模式</option>
        </select>
        <input type="number" id="max_steps" title="步数预算" placeholder="步数" style="width:72px">
        <button class="primary" onclick="submitTask()">提交任务</button>
      </div>
    </div>
    <div id="task-list"></div>
  </aside>
  <section class="main">
    <div id="detail" class="empty">← 提交一个任务，或在左侧选择历史任务查看执行轨迹</div>
    <div id="detail-body" style="display:none">
      <div class="goal-box">
        <div class="label">任务目标 · <span id="d-id"></span> · <span id="d-meta"></span></div>
        <div id="d-goal"></div>
        <div id="d-bars" style="margin-top:8px"></div>
        <div id="d-plan" style="margin-top:8px"></div>
        <div class="actions">
          <button class="ghost" onclick="approveTask()" id="btn-approve" style="display:none;border-color:#c9a6ff;color:#c9a6ff">✓ 批准执行</button>
          <button class="ghost" onclick="rejectTask()" id="btn-reject" style="display:none;border-color:#e5604c;color:#e5604c">✗ 拒绝</button>
          <button class="ghost" onclick="resumeTask()">从断点恢复</button>
          <button class="ghost" onclick="cancelTask()">取消任务</button>
          <button class="ghost" onclick="exportTrace('json')">导出 JSON</button>
          <button class="ghost" onclick="exportTrace('md')">导出 Markdown</button>
        </div>
      </div>
      <div id="result" style="display:none"><div class="label">交付结果</div><div id="d-result"></div></div>
      <div id="timeline"><div class="label">执行轨迹（时间线）</div><div id="events"></div></div>
    </div>
  </section>
</div>
<script>
let currentId = null, lastSeq = -1, pollTimer = null;
const evPayload = e => JSON.stringify(e.payload);

// ---- API Key：header 输入框，存 localStorage，所有请求自动携带 ----
const keyInput = document.getElementById('apikey');
keyInput.value = localStorage.getItem('agent_api_key') || '';
keyInput.addEventListener('change', () => {
  localStorage.setItem('agent_api_key', keyInput.value.trim());
  refreshList().catch(() => {});
});
const theKey = () => keyInput.value.trim();
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (theKey()) h['X-API-Key'] = theKey();
  return h;
}
function authQS(url) {
  // 仅 SSE（EventSource 无法设置请求头）允许 key 进查询串
  if (!theKey()) return url;
  return url + (url.includes('?') ? '&' : '?') + 'api_key=' + encodeURIComponent(theKey());
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = authHeaders(opts.headers);
  const r = await fetch(path, opts);
  if (r.status === 401) throw new Error('未授权：请在右上角填入 API Key');
  if (r.status === 403) throw new Error('禁止访问：' + ((await r.json()).detail || '租户被禁用或权限不足'));
  if (r.status === 429) {
    const retry = r.headers.get('Retry-After');
    throw new Error('触发限流：' + ((await r.json()).detail || '') + (retry ? `（${retry}s 后重试）` : ''));
  }
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}

function toast(msg, isError) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `position:fixed;top:16px;right:16px;z-index:99;padding:10px 16px;border-radius:8px;` +
    `font-size:13px;background:${isError ? '#3d201c' : '#16342a'};color:${isError ? '#ff9a8a' : '#7fe0a8'};` +
    `border:1px solid ${isError ? '#e5604c' : '#3fb96f'};box-shadow:0 4px 16px rgba(0,0,0,.4)`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

async function submitTask() {
  const goal = document.getElementById('goal').value.trim();
  if (!goal) return alert('请输入任务目标');
  const body = { goal, mode: document.getElementById('mode').value };
  const ms = document.getElementById('max_steps').value;
  if (ms) body.max_steps = parseInt(ms);
  let t;
  try {
    t = await api('/api/tasks', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  } catch (e) {
    return toast('提交失败：' + e.message, true);
  }
  toast('任务已提交：' + t.id, false);
  document.getElementById('goal').value = '';
  await refreshList().catch(() => {});
  selectTask(t.id);
}

async function refreshList() {
  const tasks = await api('/api/tasks');
  const el = document.getElementById('task-list');
  el.innerHTML = tasks.map(t => `
    <div class="task-item ${t.id === currentId ? 'active' : ''}" onclick="selectTask('${t.id}')">
      <div class="goal">${esc(t.goal)}</div>
      <div class="meta"><span class="status ${t.status}">${t.status}</span>
        <span>${t.mode}</span><span>${t.tokens_used} tok</span><span>${t.steps_used} 步</span></div>
    </div>`).join('');
  const m = await api('/api/metrics');
  const status = Object.entries(m.tasks_by_status).map(([k,v]) => `${k}:${v}`).join(' / ');
  document.getElementById('metrics').innerHTML =
    `<span>任务 ${status}</span><span>tokens <b>${m.total_tokens}</b></span>` +
    `<span>自愈 <b>${m.total_selfheals}</b></span><span>平均耗时 <b>${m.avg_duration_s}s</b></span>`;
  return tasks;
}

async function selectTask(id) {
  currentId = id; lastSeq = -1;
  document.getElementById('events').innerHTML = '';
  document.getElementById('detail').style.display = 'none';
  document.getElementById('detail-body').style.display = 'block';
  document.querySelectorAll('.task-item').forEach(n => n.classList.remove('active'));
  clearInterval(pollTimer); pollTimer = null;
  closeStream();
  try {
    await refreshDetail();
    openStream();          // SSE：事件与任务快照都走推送，不再 1.5s 轮询
  } catch (e) {
    toast('加载任务详情失败：' + e.message, true);
  }
}

let es = null;
function closeStream() { if (es) { es.close(); es = null; } }
function openStream() {
  if (!currentId || es) return;
  es = new EventSource(authQS(`/api/tasks/${currentId}/stream`));
  es.addEventListener('task', ev => { try { renderTask(JSON.parse(ev.data)); } catch (_) {} });
  es.addEventListener('stream_end', () => { closeStream(); refreshDetail(); });
  // 其余事件按类型名注册：与后端 emit 的事件名一一对应
  for (const t of ['llm_step','tool_result','tool_error','tool_replay','tool_retry_scheduled',
                   'tool_retry_success','tool_retry_exhausted','tool_validation_failed',
                   'selfheal_success','plan_created','step_done','replan','critic','compress',
                   'budget_downgrade','budget_exceeded','task_done','task_failed','task_canceled',
                   'subagent_event']) {
    es.addEventListener(t, ev => {
      try { const e = JSON.parse(ev.data); appendEvent(e); } catch (_) {}
    });
  }
  es.onerror = () => { closeStream(); };
}

const TERMINAL = ['done', 'failed', 'canceled', 'budget_exceeded'];

async function refreshDetail() {
  if (!currentId) return;
  const t = await api(`/api/tasks/${currentId}`);
  await refreshList();
  renderTask(t);
}

function renderTask(t) {
  document.getElementById('d-id').textContent = t.id;
  document.getElementById('d-goal').textContent = t.goal;
  document.getElementById('d-meta').textContent =
    `${t.mode} · ${t.status} · ${t.tokens_used} tokens · ${t.steps_used} 步 · 自愈 ${t.selfheal_count} 次 · ${t.duration_s}s`;

  // 预算进度条：token 与步数双维度（与后端双维预算对应）
  const pct = (a, b) => (b ? Math.min(100, Math.round(a / b * 100)) : 0);
  document.getElementById('d-bars').innerHTML = `
    <div class="bar-wrap"><span class="bar-label">token ${t.tokens_used}/${t.max_tokens}</span>
      <div class="bar"><i style="width:${pct(t.tokens_used, t.max_tokens)}%"></i></div></div>
    <div class="bar-wrap"><span class="bar-label">步数 ${t.steps_used}/${t.max_steps}</span>
      <div class="bar"><i style="width:${pct(t.steps_used, t.max_steps)}%"></i></div></div>`;

  const terminal = TERMINAL.includes(t.status);
  const chips = [];
  if (t.status === 'waiting_approval') chips.push('<span class="plan-chip warn">⏸ 待人工审批（下一轮工具执行前）</span>');
  if (t.downgraded) chips.push('<span class="plan-chip warn">已降级</span>');
  if (t.selfheal_count) chips.push(`<span class="plan-chip">自愈 ${t.selfheal_count} 次</span>`);
  if (!terminal && t.checkpoint_next && t.checkpoint_next.length) {
    chips.push(`<span class="plan-chip">断点：${esc(t.checkpoint_next.join(', '))}</span>`);
  }
  document.getElementById('d-plan').innerHTML = chips.join('');
  document.getElementById('btn-approve').style.display = t.status === 'waiting_approval' ? '' : 'none';
  document.getElementById('btn-reject').style.display = t.status === 'waiting_approval' ? '' : 'none';

  const box = document.getElementById('result');
  if (t.result) { box.style.display = 'block'; document.getElementById('d-result').textContent = t.result; }
  else if (t.error) { box.style.display = 'block'; document.getElementById('d-result').textContent = '错误：' + t.error; }
  else { box.style.display = 'none'; }

  if (terminal) { clearInterval(pollTimer); pollTimer = null; }
}

function appendEvent(e) {
  const el = document.getElementById('events');
  const div = document.createElement('div');
  div.className = `ev t-${e.type}`;
  const payload = evPayload(e);
  div.innerHTML =
    `<span class="seq">#${e.seq}</span><span class="type">${e.type}</span>` +
    `<span class="body">${esc(payload).slice(0, 220)}</span>` +
    (payload.length > 220 ? `<details class="ev-more"><summary>展开完整参数/结果</summary>` +
      `<pre>${esc(payload)}</pre></details>` : '');
  el.appendChild(div);
  lastSeq = Math.max(lastSeq, e.seq || 0);
}

async function exportTrace(format) {
  if (!currentId) return;
  const res = await fetch(`/api/tasks/${currentId}/export?format=${format}`, { headers: authHeaders() });
  if (!res.ok) { toast('导出失败：' + res.status, true); return; }
  const text = await res.text();
  const blob = new Blob([text], { type: format === 'md' ? 'text/markdown' : 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `trace-${currentId}.${format}`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function resumeTask() {
  if (!currentId) return;
  await api(`/api/tasks/${currentId}/resume`, { method: 'POST' });
  if (!pollTimer) { selectTask(currentId); }
}

async function approveTask() {
  if (!currentId) return;
  await api(`/api/tasks/${currentId}/approve`, { method: 'POST' });
  toast('已批准，任务继续执行', false);
  selectTask(currentId);
}

async function rejectTask() {
  if (!currentId) return;
  await api(`/api/tasks/${currentId}/reject`, { method: 'POST' });
  toast('已拒绝，任务将取消', false);
  selectTask(currentId);
}

async function cancelTask() {
  if (!currentId) return;
  await api(`/api/tasks/${currentId}/cancel`, { method: 'POST' });
  refreshDetail();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
refreshList().catch(() => {});
setInterval(refreshList, 4000);
</script>
</body>
</html>
